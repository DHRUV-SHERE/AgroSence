# Keeps the Render free web service awake and the MongoDB Atlas cluster active.
# GET /api/health does a real DB round-trip + heartbeat write, so both services see traffic.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#   BACKEND_URL  = https://<your-service>.onrender.com   (no trailing slash)
#   FRONTEND_URL = https://<your-app>.vercel.app         (optional)
name: Keep services alive

on:
  schedule:
    - cron: "*/10 * * * *"   # Render sleeps after 15 min idle; GitHub may delay runs a few minutes
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health (wakes Render + touches MongoDB)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL variable not set"; exit 1; fi
          # Cold start on Render can take ~50s, so retry generously.
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 90 "$BACKEND_URL/api/health" || echo 000)
            echo "attempt $i -> HTTP $code"; cat /tmp/out.json 2>/dev/null; echo
            [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "Backend unhealthy"; exit 1; }
          if [ -n "$FRONTEND_URL" ]; then curl -s -o /dev/null -w "frontend HTTP %{http_code}\n" --max-time 30 "$FRONTEND_URL" || true; fi
