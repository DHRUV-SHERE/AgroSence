<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f6b3a" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AgroSence admin and moderation panel" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>AgroSence Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #f6f3ea; }
      @media (prefers-color-scheme: dark) { body { background: #121a14; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #2f6b3a33; border-top-color: #2f6b3a; animation: s .8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="boot"><i></i></div></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
