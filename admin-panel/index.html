<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b6b3a" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AgroSense admin and moderation panel" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <title>AgroSense Admin</title>
    <style>
      body { margin: 0; background: #f5f8f6; }
      @media (prefers-color-scheme: dark) { body { background: #0c1511; } }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1b6b3a33; border-top-color: #1b6b3a; animation: s .8s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"><div class="boot"><i></i></div></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
