<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F1E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120D" media="(prefers-color-scheme: dark)" />
    <title>AgroSense | Sell your harvest directly to buyers</title>
    <meta
      name="description"
      content="AgroSense connects farmers directly with buyers. List crops, detect crop problems with AI, follow government schemes, and get expert advice in English, Hindi and Gujarati."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgroSense" />
    <meta property="og:title" content="AgroSense | Sell your harvest directly to buyers" />
    <meta property="og:description" content="List crops, find buyers, detect crop problems with AI and follow government schemes. Built for Indian farmers." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("agro_theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AgroSense needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
