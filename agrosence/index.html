<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="aYtFVlLJqE0S0YVKfb1wJN8dn-G-CMrd-5dlrNsT7Q4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F1E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17120D" media="(prefers-color-scheme: dark)" />
    <!-- seo:start (replaced per route at build time by scripts/prerender.mjs; Seo.jsx keeps it current while browsing) -->
    <title>AgroSense: Sell Crops Directly to Buyers in India</title>
    <meta name="description" content="AgroSense lets Indian farmers list crops, set their own price and sell directly to buyers." />
    <!-- seo:end -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable site summary" />


    <link rel="preload" href="/fonts/inter-latin-wght-v1.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Wake the (free-tier) API while the page loads: preconnect here; main.jsx fires the cheap /api/health ping. -->
    <link rel="preconnect" href="https://agrosence-1.onrender.com" crossorigin />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("agro_theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AgroSense needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
